name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Snapshot references in Tests/KinietaTests/__Snapshots__ were recorded on this
  # simulator and runtime. Keep in sync with README "Development".
  DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - name: Verify xcbeautify
        run: command -v xcbeautify || brew install xcbeautify && xcbeautify --version
      # Only the resolved package checkouts are cached. The key changes with the
      # Xcode build or the manifest, not with every source edit, so a push restores
      # it exactly and saves nothing new. Package.resolved is not committed, so a
      # restored cache still resolves `from:` ranges to their latest versions.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-xcode-${{ steps.xcode.outputs.build }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Test package
        run: |
          set -o pipefail
          xcodebuild -scheme Kinieta -destination "$DESTINATION" -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult test | xcbeautify --renderer github-actions
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
      - name: Build example app
        run: |
          set -o pipefail
          xcodebuild -project Example/KinietaDemo.xcodeproj -scheme KinietaDemo -destination "$DESTINATION" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions

  # The snapshot references are iOS only, so Catalyst and visionOS run every
  # test except the snapshot suite, and tvOS is a build check with no test run.
  catalyst:
    name: Build and test (Mac Catalyst)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Verify xcbeautify
        run: command -v xcbeautify || brew install xcbeautify && xcbeautify --version
      - name: Test package
        run: |
          set -o pipefail
          xcodebuild -scheme Kinieta -destination 'platform=macOS,variant=Mac Catalyst' test | xcbeautify --renderer github-actions

  tvos:
    name: Build (tvOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Verify xcbeautify
        run: command -v xcbeautify || brew install xcbeautify && xcbeautify --version
      - name: Build package
        run: |
          set -o pipefail
          xcodebuild -scheme Kinieta -destination 'generic/platform=tvOS Simulator' build | xcbeautify --renderer github-actions

  # An XCFramework is built with library evolution. The module and its main
  # class share the name Kinieta, so the .swiftinterface verifies only when it
  # names the module by an alias.
  evolution:
    name: Build with library evolution (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Verify xcbeautify
        run: command -v xcbeautify || brew install xcbeautify && xcbeautify --version
      - name: Build package
        run: |
          set -o pipefail
          xcodebuild -scheme Kinieta -destination 'generic/platform=iOS Simulator' BUILD_LIBRARY_FOR_DISTRIBUTION=YES OTHER_SWIFT_FLAGS=-alias-module-names-in-module-interface build | xcbeautify --renderer github-actions

  visionos:
    name: Build and test (visionOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Verify xcbeautify
        run: command -v xcbeautify || brew install xcbeautify && xcbeautify --version
      - name: Install the visionOS simulator runtime
        run: xcrun simctl list runtimes | grep -q '^visionOS 26\.5 ' || xcodebuild -downloadPlatform visionOS -buildVersion 26.5
      - name: Test package
        run: |
          set -o pipefail
          xcodebuild -scheme Kinieta -destination 'platform=visionOS Simulator,name=Apple Vision Pro,OS=26.5' test | xcbeautify --renderer github-actions

  # On the macOS host, `swift test` runs the experimental AppKit tests, the
  # same ones `xcodebuild test` would for platform=macOS, and the AppKit
  # example app is built. On Linux every source and test file compiles away
  # behind canImport(UIKit) || os(macOS), so `swift build` and `swift test`
  # succeed there and run 0 tests.
  spm-macos:
    name: swift build + test (macOS host)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Verify xcbeautify
        run: command -v xcbeautify || brew install xcbeautify && xcbeautify --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build example app (macOS)
        run: |
          set -o pipefail
          xcodebuild -project Example/KinietaDemo.xcodeproj -scheme KinietaDemoMac -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions

  spm-linux:
    name: swift build + test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  # Catches podspec regressions, such as a dropped privacy bundle, until 1.1.0,
  # the final CocoaPods release. Optional: a failure here does not fail the run.
  # `pod lib lint` builds for every platform the podspec declares (iOS, tvOS
  # and macOS), on a simulator where there is one, so the tvOS runtime is
  # installed if the runner lacks it.
  pod-lint:
    name: pod lib lint (optional)
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Verify CocoaPods
        run: command -v pod || brew install cocoapods && pod --version
      - name: Install the tvOS simulator runtime
        run: xcrun simctl list runtimes | grep -q '^tvOS ' || xcodebuild -downloadPlatform tvOS
      - name: Lint podspec
        run: pod lib lint Kinieta.podspec --allow-warnings

  lint:
    name: swift-format lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Lint
        run: xcrun swift-format lint --strict --recursive Sources Tests Example
