name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Snapshot references in Tests/KinietaTests/__Snapshots__ were recorded on this
  # simulator and runtime. Keep in sync with README "Development".
  DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Xcode version
        run: xcodebuild -version
      - name: Verify xcbeautify
        run: command -v xcbeautify || brew install xcbeautify && xcbeautify --version
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: deriveddata-${{ runner.os }}-
      - name: Test package
        run: |
          set -o pipefail
          xcodebuild -scheme Kinieta -destination "$DESTINATION" -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult test | xcbeautify --renderer github-actions
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
      - name: Build example app
        run: |
          set -o pipefail
          xcodebuild -project Example/KinietaDemo.xcodeproj -scheme KinietaDemo -destination "$DESTINATION" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions

  # The snapshot references are iOS only, so Catalyst runs every test except
  # the snapshot suite, and tvOS is a build check with no test run.
  catalyst:
    name: Build and test (Mac Catalyst)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Verify xcbeautify
        run: command -v xcbeautify || brew install xcbeautify && xcbeautify --version
      - name: Test package
        run: |
          set -o pipefail
          xcodebuild -scheme Kinieta -destination 'platform=macOS,variant=Mac Catalyst' test | xcbeautify --renderer github-actions

  tvos:
    name: Build (tvOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Verify xcbeautify
        run: command -v xcbeautify || brew install xcbeautify && xcbeautify --version
      - name: Build package
        run: |
          set -o pipefail
          xcodebuild -scheme Kinieta -destination 'generic/platform=tvOS Simulator' build | xcbeautify --renderer github-actions

  # Kinieta is UIKit only. On other hosts every source and test file compiles
  # away behind canImport(UIKit); these jobs keep that true, so `swift build`
  # and `swift test` succeed there and run 0 tests.
  spm-macos:
    name: swift build + test (macOS host)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  spm-linux:
    name: swift build + test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  lint:
    name: swift-format lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Lint
        run: xcrun swift-format lint --strict --recursive Sources Tests Example/KinietaDemo
